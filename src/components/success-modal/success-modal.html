<!-- Нативный <dialog>: showModal() сам держит фокус внутри, закрывается по Esc, блокирует страницу -->
<dialog class="success-modal" aria-labelledby="success-modal-title">
  <div class="success-modal__body">
    <button class="success-modal__close" type="button" aria-label="Закрыть" data-i18n-aria-label="successModal.close">
      <span aria-hidden="true">×</span>
    </button>

    <div class="success-modal__check" aria-hidden="true">✓</div>

    <h2 class="success-modal__title" id="success-modal-title" data-i18n="successModal.title">Заявка отправлена!</h2>
    <p class="success-modal__text" data-i18n="successModal.text">
      Спасибо! Мы свяжемся с вами в ближайшее время.
    </p>

    <button class="success-modal__btn button-main primary" type="button">
      <span data-i18n="successModal.btn">Хорошо</span>
    </button>
  </div>
</dialog>
